{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish · {{ COMPANY.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <a class="brand text-dark mb-4" href="{% url 'landing' %}"><span class="brand-mark"><i class="bi bi-stars"></i></span>{{ COMPANY.name }}</a>
    <h1>Tizimga kirish</h1>
    <p class="text-muted">Login va parolingizni kiriting.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% if form.non_field_errors %}
        <div class="alert alert-danger" role="alert">Login yoki parol noto'g'ri. Qayta tekshirib ko'ring.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Login</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label" for="{{ form.password.id_for_label }}">Parol</label>
        {{ form.password }}
      </div>
      <button class="btn btn-primary w-100" type="submit">Kirish</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">Mijozmisiz? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a></p>
  </div>
</div>
</body>
</html>
