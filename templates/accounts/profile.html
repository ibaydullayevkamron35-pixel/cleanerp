{% extends base_template %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="page-head"><h1>Profil</h1></div>
<div class="card" style="max-width: 640px">
  <form method="post" enctype="multipart/form-data" class="card-body" novalidate>
    {% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-6">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small mt-1" role="alert">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">Saqlash</button>
      <a class="btn btn-outline-secondary" href="{% url 'password_change' %}"><i class="bi bi-key me-1"></i>Parolni o'zgartirish</a>
    </div>
  </form>
</div>
{% endblock %}
