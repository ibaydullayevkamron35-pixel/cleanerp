{% if messages %}
<div class="mb-3" role="status" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show {% if message.level < 40 %}auto-dismiss{% endif %}" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Yopish"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
